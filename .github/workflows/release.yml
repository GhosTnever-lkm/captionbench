name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Package application
        shell: bash
        run: |
          mkdir -p dist
          zip -r "dist/CaptionBench-${GITHUB_REF_NAME}.zip" index.html app.mjs captions.mjs file-policy.mjs styles.css icon.svg README.md LICENSE VERSION docs/screenshot.png
          sha256sum "dist/CaptionBench-${GITHUB_REF_NAME}.zip" > "dist/CaptionBench-${GITHUB_REF_NAME}.zip.sha256"
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
